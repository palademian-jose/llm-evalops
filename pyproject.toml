[project]
name = "llm-evalops"
version = "0.1.0"
description = "evalkit: golden sets, calibrated LLM judge, A/B statistics and CI gate. llmops: tracing, cost, latency, caching, alerts and a dashboard."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Deimos" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.13",
    "typer>=0.12",
    "pyyaml>=6.0",
    "filelock>=3.13",
    "openai>=3.31.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.36", "pandas>=2.2"]
otel = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]
redis = ["redis>=5.0"]

[project.scripts]
evalkit = "evalkit.cli:app"
llmops = "llmops.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
    "streamlit>=1.36",
    "pandas>=2.2",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalkit", "src/llmops"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "B017"]
"examples/corpus.py" = ["E501"]
"scripts/demo.py" = ["E501"]
"src/llmops/cost.py" = ["E501"]
"src/llmops/latency.py" = ["E501"]
"src/llmops/cache/*" = ["E501"]
"src/llmops/alerts/*" = ["E501"]
"src/llmops/cli.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 300
filterwarnings = ["ignore::DeprecationWarning"]
